name: Publish Ratan to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and flows
        run: |
          for f in script.js experience.js config.js catalogue-data.js brochure/studio.js brochure/pdf.js; do node --check "$f"; done
          npm install --prefix tests --ignore-scripts
          node tests/flows.cjs
          node tests/pdf.cjs
          node tests/staff.cjs
      - name: Prepare public website
        run: |
          mkdir -p _site
          cp index.html styles.css script.js config.js catalogue-data.js experience.js _site/
          cp -R assets _site/assets
          cp -R brochure _site/brochure
          rm _site/brochure/sheet-menu.gs
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/instrumentserif/InstrumentSerif-Regular.ttf' -o _site/brochure/assets/InstrumentSerif-Regular.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/dmsans/DMSans%5Bopsz%2Cwght%5D.ttf' -o _site/brochure/assets/DMSans.ttf
          test "$(git hash-object _site/brochure/assets/InstrumentSerif-Regular.ttf)" = "36fac00ef9b7d523236df6536cb09c712bb2c7e4"
          test "$(git hash-object _site/brochure/assets/DMSans.ttf)" = "c672f98060af9b2c85fca704ebd5ad9a8717c1df"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
